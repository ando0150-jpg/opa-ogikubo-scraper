STREAMING_CHUNK:Configuring GitHub Actions workflow with all required dependencies

name: DMM Machine Sync

on:

毎週火曜日の朝9:00（JST = UTC 00:00）に自動実行

schedule:
- cron: '0 0 * * 2'

手動実行ボタン

workflow_dispatch:

jobs:
scrape-and-sync:
runs-on: ubuntu-latest
steps:
- name: リポジトリをチェックアウト
uses: actions/checkout@v4

  - name: Python環境のセットアップ
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: 必要なライブラリのインストール
    run: |
      python -m pip install --upgrade pip
      pip install requests playwright beautifulsoup4
      playwright install chromium --with-deps

  - name: スクレイピング＆GAS送信を実行
    env:
      GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
    run: |
      python scraper.py
