name: DMM Machine Sync

on:
  # 1. 毎週火曜日の朝9:00（JST）に自動実行
  # ※ UTC時間で設定するため前日月曜の00:00 UTC = 日本時間 火曜09:00
  schedule:
    - cron: '0 0 * * 2'
  
  # 2. GitHubの画面から手動でいつでも実行できるボタンを設置
  workflow_dispatch:

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium --with-deps

      - name: スクレイピング＆GAS送信を実行
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          python scraper.py
